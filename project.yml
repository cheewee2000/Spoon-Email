name: Spoon Email
options:
  bundleIdPrefix: com.cwandt
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  MailCore:
    path: MailCore
settings:
  base:
    MARKETING_VERSION: 0.39.0
    CURRENT_PROJECT_VERSION: 1
    # Swift 5 language mode: GRDB 6 ValueObservation closures crash under
    # Swift 6 dynamic actor-isolation checking (they run on DB queues).
    SWIFT_VERSION: 5.0
targets:
  Spoon Email:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
        excludes:
          - Info.plist
          - Spoon-iOS.entitlements
      - path: Shared
    dependencies:
      - package: MailCore
      - target: SpoonWidgets
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.spoon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L6DVQR8JB9
        ENABLE_HARDENED_RUNTIME: NO
        # Both together: Xcode merges the INFOPLIST_KEY_* settings below into
        # App/Info.plist, which carries the keys that have no build-setting
        # equivalent (UIBackgroundModes, BGTaskSchedulerPermittedIdentifiers).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "CW&T"
        INFOPLIST_KEY_NSContactsUsageDescription: "Shows the photo your address book already has for the people who write to you."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        SWIFT_STRICT_CONCURRENCY: minimal
        # App Group for the widget snapshot — iOS only; the Mac build has no
        # widgets and no provisioning for the group.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/Spoon-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/Spoon-iOS.entitlements
  SpoonWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - SpoonWidgets.entitlements
      - path: Shared
      - path: App/Fonts
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Spoon Email
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
    entitlements:
      path: Widgets/SpoonWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cwandt.spoon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.spoon.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L6DVQR8JB9
        SWIFT_STRICT_CONCURRENCY: minimal
        SKIP_INSTALL: YES
